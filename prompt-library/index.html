:root {
  color-scheme: light;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 76px;
}
body {
  background: #fcfaff;
  color: #1f1835;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 35;
  background: #fcfaff;
}
.no-scrollbar {
  scrollbar-width: none;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.blob {
  position: absolute;
  border-radius: 9999px;
  filter: blur(70px);
  opacity: .75;
  pointer-events: none;
}
.hero-grad {
  background: linear-gradient(100deg, #6d3fe0 0%, #b04fd8 38%, #f2559b 64%, #f26b1d 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.petal {
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
}
.petal:focus-visible {
  outline: none;
}
.petal:focus-visible path:first-child {
  stroke: #5b2fd6;
  stroke-width: 4;
}
.flower-spin {
  animation: float 7s ease-in-out infinite;
  transform-origin: 200px 200px;
}
@keyframes float {
  0%,100% {
    transform: translateY(0) rotate(0deg);
  }
  50% {
    transform: translateY(-6px) rotate(2deg);
  }
}
.fade-in {
  animation: fade .2s ease-out both;
}
.slide-in {
  animation: slide .32s cubic-bezier(.2,.8,.2,1) both;
}
.toast-in {
  animation: toast .28s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes slide {
  from {
    transform: translateX(40px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes toast {
  from {
    transform: translateY(12px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .flower-spin, .fade-in, .slide-in, .toast-in {
    animation: none;
  }
  *, *::before, *::after {
    transition-duration: 0s !important;
  }
}
.clamp-1 {
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
